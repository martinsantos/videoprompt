<!DOCTYPE html>
<html>
<head>
    <title>Generador de Videos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Generador de Videos</h1>
        <form id="videoForm">
            <!-- Metadatos -->
            <h2>Metadatos</h2>
            <input type="text" class="form-control mb-2" placeholder="Título" required>
            <input type="text" class="form-control mb-2" placeholder="Duración (ej: 30s)" required>
            
            <!-- Estilo -->
            <h2 class="mt-3">Estilo</h2>
            <select class="form-select mb-2">
                <option>Kawaii Vibrante</option>
                <option>Dramático</option>
                <option>Profesional</option>
            </select>
            
            <!-- Escenas -->
            <h2 class="mt-3">Escenas</h2>
            <div id="escenas">
                <div class="escena mb-3 p-2 border">
                    <h5>Escena 1</h5>
                    <textarea class="form-control mb-2" placeholder="Descripción" required></textarea>
                    <input type="number" class="form-control" placeholder="Duración (segundos)" value="5" min="1">
                </div>
            </div>
            
            <button type="button" class="btn btn-secondary" onclick="agregarEscena()">+ Agregar Escena</button>
            <button type="submit" class="btn btn-primary">Generar Video</button>
        </form>
    </div>
    
    <script>
        let contadorEscenas = 1;
        
        function agregarEscena() {
            contadorEscenas++;
            const nuevaEscena = `
                <div class="escena mb-3 p-2 border">
                    <h5>Escena ${contadorEscenas}</h5>
                    <textarea class="form-control mb-2" placeholder="Descripción" required></textarea>

                </div>`;

            e.preventDefault();

        });
    </script>
</body>
</html>
